# ---------------------------------------------------------------------------
# Runs the WHOLE application as two services built from the same image:
#   chatbot  -> chat UI            http://localhost:8501
#   gui      -> Embedding Manager  http://localhost:8502
#
# They SHARE runtime data through the volume mounts below, so a document you
# upload/embed in the GUI is immediately queryable in the chatbot. Data lives
# on the host (bind mounts), so it persists across `docker compose down/up`.
#
# Usage:
#   docker compose up --build          # build once, start both services
#   docker compose up -d --build       # same, detached
#   docker compose down                # stop both (data on host is kept)
# ---------------------------------------------------------------------------

services:
  db:
    # Postgres stores the Q&A history (every question + answer + metadata).
    # Both the chatbot and the widget API write here; the admin GUI reads it.
    # alpine image keeps the footprint small (~250 MB on disk vs ~430 MB).
    image: postgres:16-alpine
    container_name: techdoc-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techdoc}
      POSTGRES_USER: ${POSTGRES_USER:-techdoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techdoc}   # set a real one in .env
    volumes:
      - pgdata:/var/lib/postgresql/data   # named volume -> data persists
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techdoc} -d ${POSTGRES_DB:-techdoc}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  chatbot:
    build: .
    image: techdoc-rag:latest           # built once, reused by the gui service
    container_name: techdoc-chatbot
    command: >
      streamlit run chatBOT_engine.py
      --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env                            # ANTHROPIC_API_KEY, SKIP_PAGES, DB_*, etc.
    depends_on:
      db:
        condition: service_healthy      # don't start answering until DB is ready
    volumes:
      - ./chroma_Name:/app/chroma_Name  # vector store (shared)
      - ./pdf:/app/pdf                  # source PDFs + extracted images (shared)
      - ./pptx:/app/pptx                # source decks (shared)
      - ./table:/app/table              # extracted tables (shared)
      - ./config.json:/app/config.json  # answer engine + threshold (shared)
      - ./models:/app/models            # optional Qwen GGUF (shared, read-only use)
      - ./logs:/app/logs                # app logs (set log_file=logs/app.log in config)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s                 # allow first-run ONNX model download
    restart: unless-stopped

  gui:
    build: .
    image: techdoc-rag:latest
    container_name: techdoc-gui
    depends_on:
      chatbot:
        condition: service_started      # ensures the image is built once first
      db:
        condition: service_healthy
    command: >
      streamlit run embeddingGUI.py
      --server.port=8502 --server.address=0.0.0.0
    ports:
      - "8502:8502"
    env_file:
      - .env
    volumes:
      - ./chroma_Name:/app/chroma_Name  # SAME mounts as chatbot -> shared state
      - ./pdf:/app/pdf
      - ./pptx:/app/pptx
      - ./table:/app/table
      - ./config.json:/app/config.json
      - ./models:/app/models
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8502/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  api:
    build: .
    image: techdoc-rag:latest
    container_name: techdoc-api
    depends_on:
      chatbot:
        condition: service_started
      db:
        condition: service_healthy
    command: >
      uvicorn api_server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./chroma_Name:/app/chroma_Name  # SAME store the chatbot/GUI use
      - ./pdf:/app/pdf
      - ./pptx:/app/pptx
      - ./table:/app/table
      - ./config.json:/app/config.json
      - ./models:/app/models
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  demo:
    # Fake third-party website that embeds the widget via a <script> tag.
    # Served on a DIFFERENT origin (:9000) than the API (:8000) to exercise CORS.
    build: .
    image: techdoc-rag:latest
    container_name: techdoc-demo
    depends_on:
      - api
    command: >
      python -m http.server 9000 --directory demo-site
    ports:
      - "9000:9000"
    restart: unless-stopped

# Named volume for the Postgres data directory (persists across down/up).
volumes:
  pgdata:
